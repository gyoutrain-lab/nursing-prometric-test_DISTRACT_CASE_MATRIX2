        // --- Web Audio API Sound Synthesizer ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Correct Sound (High-pitched dual chime)
        function playCorrectSound() {
            initAudio();
            const now = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.type = 'sine';
            osc2.type = 'triangle';

            osc1.frequency.setValueAtTime(523.25, now); // C5
            osc1.frequency.setValueAtTime(659.25, now + 0.08); // E5
            osc1.frequency.setValueAtTime(783.99, now + 0.16); // G5

            osc2.frequency.setValueAtTime(1046.50, now + 0.16); // C6

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.45);
            osc2.stop(now + 0.45);
        }

        // Incorrect Sound (Low frequency double buzzer)
        function playIncorrectSound() {
            initAudio();
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.setValueAtTime(120, now + 0.12);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.35);
        }

        // Applause & Fanfare Sound Synthesizer
        function playApplauseSound() {
            initAudio();
            const now = audioCtx.currentTime;
            const duration = 2.2;

            // Clapping noise generator
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1100, now);
            filter.Q.setValueAtTime(1.2, now);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.22, now + 0.2);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start(now);
            noise.stop(now + duration);

            // Fanfare notes
            const fanfareNotes = [523.25, 659.25, 783.99, 1046.50];
            fanfareNotes.forEach((freq, index) => {
                const noteOsc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();

                noteOsc.type = 'triangle';
                noteOsc.frequency.setValueAtTime(freq, now + (index * 0.1));

                noteGain.gain.setValueAtTime(0.18, now + (index * 0.1));
                noteGain.gain.exponentialRampToValueAtTime(0.001, now + (index * 0.1) + 0.35);

                noteOsc.connect(noteGain);
                noteGain.connect(audioCtx.destination);

                noteOsc.start(now + (index * 0.1));
                noteOsc.stop(now + (index * 0.1) + 0.35);
            });
        }

        let currentQuestionIndex = 0;
        let score = 0;
        let correctCount = 0;
        let isAnsweringAllowed = true;

        function loadQuestion() {
            isAnsweringAllowed = true;
            const q = questions[currentQuestionIndex];

            document.getElementById('question-number').innerText = `Question ${currentQuestionIndex + 1}`;
            document.getElementById('progress-text').innerText = `${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('feedback-message').innerText = '';

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium border border-slate-600 flex justify-between items-center text-sm md:text-base";
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, buttonEl) {
            if (!isAnsweringAllowed) return;
            isAnsweringAllowed = false;

            const q = questions[currentQuestionIndex];
            const feedbackEl = document.getElementById('feedback-message');
            const allButtons = document.querySelectorAll('.option-btn');

            if (selectedIndex === q.answer) {
                playCorrectSound();
                score += 100;
                correctCount++;
                document.getElementById('score-display').innerText = score;

                buttonEl.classList.remove('bg-slate-700', 'hover:bg-slate-600');
                buttonEl.classList.add('bg-emerald-600', 'border-emerald-500', 'text-white');
                feedbackEl.innerText = "Correct!";
                feedbackEl.className = "text-center font-bold text-base h-6 text-emerald-400";
            } else {
                playIncorrectSound();
                buttonEl.classList.remove('bg-slate-700', 'hover:bg-slate-600');
                buttonEl.classList.add('bg-rose-600', 'border-rose-500', 'text-white');

                // Highlight correct answer
                allButtons[q.answer].classList.remove('bg-slate-700');
                allButtons[q.answer].classList.add('bg-emerald-600', 'border-emerald-500');

                feedbackEl.innerText = "Incorrect!";
                feedbackEl.className = "text-center font-bold text-base h-6 text-rose-400";
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    loadQuestion();
                } else {
                    finishGame();
                }
            }, 1200);
        }

        function finishGame() {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            
            const accuracy = Math.round((correctCount / questions.length) * 100);
            document.getElementById('accuracy-rate').innerText = `Accuracy: ${accuracy}% (${correctCount} of ${questions.length} correct)`;
            
            playApplauseSound();
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            correctCount = 0;
            document.getElementById('score-display').innerText = score;
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
